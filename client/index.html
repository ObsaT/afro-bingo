<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#130d29" />
    <link id="app-manifest" rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>AFRO BINGO</title>
    <!-- Dynamic Manifest for Dedicated Admin / Agent APK Installation -->
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var m = document.getElementById('app-manifest');
        if (m) {
          if (path.indexOf('/agent') !== -1 || search.indexOf('agent=true') !== -1) {
            m.href = '/manifest-agent.json';
            document.title = 'Afro Bingo Agent';
          } else if (path.indexOf('/admin') !== -1 || search.indexOf('admin=true') !== -1) {
            m.href = '/manifest-admin.json';
            document.title = 'Afro Bingo Admin';
          } else {
            m.href = '/manifest-player.json';
            document.title = 'AFRO BINGO';
          }
        }
      })();
    </script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body class="bg-[#120c24] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

services:
  - type: web
    name: afro-bingo
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/state
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: ADMIN_PIN
        value: admin123
      - key: ADMIN_TOKEN
        value: afro_admin_secret_token_2026
